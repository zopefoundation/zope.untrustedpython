[buildout]
develop = .
parts = test coverage-test python

[test]
recipe = zc.recipe.testrunner
eggs = zope.untrustedpython

[coverage-test]
recipe = zc.recipe.testrunner
eggs = zope.untrustedpython
defaults = ['--coverage', '${buildout:directory}/coverage']

[python]
recipe = zc.recipe.egg
eggs =
    zope.untrustedpython
interpreter = python
